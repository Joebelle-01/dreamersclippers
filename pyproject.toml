[project]
name = "streamclippers"
version = "0.1.0"
description = "Real-time Twitch live stream and VOD auto-clipper with vertical 9:16 studio export"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "numpy>=2.0.0",
    "opencv-python-headless>=4.10.0,<5",
    "streamlink>=7.0.0",
    "yt-dlp>=2025.1.0",
    "tzdata>=2024.1",
    "python-multipart>=0.0.12",
    "faster-whisper>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "bandit>=1.7.10",
    "pip-audit>=2.7.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.bandit]
exclude_dirs = [".venv", "tests", "frontend"]
